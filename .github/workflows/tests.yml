name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Standard library behavior
        run: python -S -m unittest discover -s tests -v
      - name: Release and documentation integrity
        run: python scripts/release.py check
      - name: Install optional format parsers
        run: python -m pip install -r requirements-test.txt
      - name: Integration tests with real PDF and RTF
        run: python -m unittest discover -s tests -v
